name: Production gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-clone-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix backend exec playwright install --with-deps chromium
      - run: npm run verify
      - run: npm test
      - run: npm --prefix backend run test:browser
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm --prefix backend audit
