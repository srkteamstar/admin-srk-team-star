<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SRK Team Star</title>
    <meta name="description" content="Secure SRK Team Star administrator dashboard for managing orders, products, customers, enquiries, quotations and upcoming projects.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#12170f">
    <link rel="icon" href="/assets/icons/SRK-Team-Star-Logos/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="preload" href="/assets/vendor/fonts/xn7gYHE41ni1AdIRggexSg.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/vendor/fonts/Jqz55SSPQuCQF3t8uOwiUL-taUTtap9Gayo.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Only the gate and its asset loader run before authentication. -->
    <script defer src="/js/modules/admin/shell/admin-assets.js"></script>
    <script defer src="/js/modules/admin/auth/admin-auth-module.js"></script>
<style>
        /* Critical sign-in styles live with the markup: no stylesheet or API
           response is needed for the first paint. Optional fonts never force
           a late swap on a slow connection. Other subsets load with the shell. */
        @font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: optional; src: url("/assets/vendor/fonts/xn7gYHE41ni1AdIRggexSg.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 900; font-display: optional; src: url("/assets/vendor/fonts/Jqz55SSPQuCQF3t8uOwiUL-taUTtap9Gayo.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        :root { --admin-ink: #12170f; --admin-copy: #1f271b; --admin-gold: #d4af37; --admin-wine: #420c14; --admin-canvas: #f6f7f4; }
        * { margin: 0; padding: 0; box-sizing: border-box; color: var(--admin-copy); font-family: "Manrope", sans-serif; font-weight: 500; }
        h1, h2, h3, h4, h5, h6 { color: #12170f; font-family: "Schibsted Grotesk", sans-serif; font-weight: 700; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { height: 100vh; height: 100dvh; overflow: hidden; line-height: 1.5; background: #fff; }
        [hidden], #admin-auth-gate.hidden, #admin-app-shell[inert] { display: none !important; }
        body:has(#admin-app-shell[inert]) > .srk-skip-link { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0; }
        #admin-auth-gate { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 24px; background: radial-gradient(circle at 82% 12%, rgba(212,175,55,.15), transparent 28%), radial-gradient(circle at 12% 88%, rgba(66,12,20,.34), transparent 32%), var(--admin-ink); }
        .admin-auth-card { width: 100%; max-width: 384px; flex-shrink: 0; margin-block: auto; padding: 32px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; background: radial-gradient(circle at 100% 0, rgba(212,175,55,.12), transparent 42%), #fff; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
        .admin-auth-eyebrow { margin-bottom: 8px; color: #806018; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .admin-auth-card h2 { margin-bottom: 8px; font-size: 20px; line-height: 1.4; font-weight: 700; }
        .admin-auth-copy { margin-bottom: 24px; color: #505b49; font-size: 14px; line-height: 1.6; }
        .admin-auth-field { margin-bottom: 24px; }
        .admin-auth-field label { display: block; margin-bottom: 8px; color: #566052; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .admin-auth-field input { display: block; width: 100%; min-height: 48px; padding: 12px 16px; border: 1px solid #a8ada4; border-radius: 8px; background: #fff; color: #12170f; font-size: 14px; font-weight: 700; line-height: 1.5; }
        .admin-auth-field input::placeholder { color: #626b5c; font-weight: 500; opacity: 1; }
        .admin-auth-field input:focus { outline: 2px solid #8a6810; outline-offset: 2px; }
        .admin-auth-submit { display: block; width: 100%; min-height: 46px; padding: 12px; border: 0; border-radius: 8px; background: #12170f; color: #fff; font-size: 14px; font-weight: 700; line-height: 1.5; cursor: pointer; transition: transform .15s ease; }
        .admin-auth-submit:hover:not(:disabled) { transform: translateY(-2px); }
        .admin-auth-submit:focus-visible, .admin-auth-link:focus-visible { outline: 2px solid #8a6810; outline-offset: 3px; }
        .admin-auth-submit:disabled { cursor: wait; opacity: .65; }
        .admin-auth-note { margin-top: 16px; color: #566052; font-size: 11px; line-height: 1.6; }
        .admin-auth-link { display: block; margin-top: 16px; color: #505b49; font-size: 13px; text-align: center; }
        .admin-auth-error { margin-bottom: 16px; padding: 8px 12px; border: 1px solid #fecaca; border-radius: 8px; background: #fef2f2; color: #991b1b; font-size: 14px; line-height: 1.5; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
        #admin-app-shell > aside { box-shadow: 10px 0 32px rgba(18,23,15,.035); }
        #dynamic-view { background: radial-gradient(circle at 88% 0, rgba(212,175,55,.045), transparent 24%), var(--admin-canvas); }
        .nav-btn, .nav-sub-btn { border: 1px solid transparent; min-height: 42px; }
        .nav-btn[aria-current="page"], .nav-sub-btn[aria-current="page"] { border-color: rgba(212,175,55,.18); box-shadow: inset 3px 0 0 #d4af37; }
        #main-content table tbody tr { transition: background-color .2s ease, box-shadow .2s ease, opacity .2s ease; }
        #main-content table tbody tr:hover { box-shadow: inset 3px 0 0 rgba(212,175,55,.7); }
        #main-content section:has(> table) { overflow-x: auto; }
        #details-drawer { box-shadow: -18px 0 45px rgba(18,23,15,.1); }
        #details-drawer input, #details-drawer select, #details-drawer textarea { border-radius: .625rem !important; }
        #details-drawer .rounded-sm, #main-content .rounded-sm, #profile-dropdown { border-radius: .625rem !important; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 2px; }
        @media (max-width: 767px) {
            #main-content section:has(> table) > table { min-width: 760px; }
            #main-content section:has(> table) > div:first-child { position: sticky; left: 0; min-width: calc(100vw - 2.5rem); }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-white selection:bg-[#d4af37] selection:text-white">

    <h1 class="sr-only">SRK Team Star administration</h1>
    <div id="admin-auth-gate" role="dialog" aria-modal="true" aria-labelledby="admin-signin-title" aria-describedby="admin-signin-description">
        <div class="admin-auth-card">
            <p class="admin-auth-eyebrow">SRK Team Star</p>
            <h2 id="admin-signin-title">Administrator sign in</h2>
            <p id="admin-signin-description" class="admin-auth-copy">This dashboard is separate from the store. Sign in with your administrator account.</p>
            <form id="admin-signin-form" method="post" action="/api/admin/login" autocomplete="on" data-srk-password-manager="allow" novalidate>
                <p id="admin-signin-error" class="admin-auth-error" role="alert" hidden></p>
                <div class="admin-auth-field">
                    <label for="admin-identifier">Email or phone</label>
                    <input id="admin-identifier" name="identifier" type="text" autocomplete="username" data-srk-password-manager="allow" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required>
                </div>
                <div class="admin-auth-field">
                    <label for="admin-password">Password</label>
                    <input id="admin-password" name="password" type="password" autocomplete="current-password" data-srk-password-manager="allow" required>
                </div>
                <button id="admin-signin-submit" type="submit" class="admin-auth-submit" disabled>Sign In</button>
            </form>
            <p class="admin-auth-note">Administrator access is granted directly in the database.</p>
            <noscript><p class="admin-auth-error">Enable JavaScript and reload this page to sign in securely.</p></noscript>
        </div>
    </div>

    <div id="admin-app-shell" inert aria-hidden="true" class="flex flex-1 min-w-0 h-full overflow-hidden">

        <!-- Left Sidebar -->
        <aside class="w-60 h-full bg-white p-6 shrink-0 flex flex-col justify-between z-40 border-r border-[#12170f]/10 overflow-y-auto no-scrollbar">
            <div class="w-full">
                <!-- /storefront, not /index.html: index.html IS this dashboard now that
                     the console is its own deployment. The route redirects to
                     STOREFRONT_URL so the page can stay a plain file with a relative
                     href and the deployment decides where the storefront lives.
                     See backend/src/core/http/storefront-link.js. -->
                <a href="/storefront" class="flex justify-center w-full mb-8 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#d4af37] rounded-sm transition-transform hover:scale-105 duration-300">
                    <img src="/assets/icons/SRK-Team-Star-Logos/admin-logo.webp" alt="SRK Team Star" width="60" height="60" loading="lazy" decoding="async" class="h-[60px] w-auto select-none" onerror="this.outerHTML='<h2 class=\'text-2xl text-[#d4af37] font-bold\'>SRK</h2>'" />
                </a>

                <ul id="admin-nav" class="w-full space-y-1.5 font-semibold text-sm text-[#1F271B]">
                    <li><button id="nav-dashboard" onclick="window.app.switchTab('dashboard', 'Overview', 'Dashboard')" class="nav-btn w-full flex items-center gap-3 text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> Dashboard</button></li>
                    <li><button id="nav-orders" onclick="window.app.switchTab('orders', 'Store', 'Orders')" class="nav-btn w-full flex items-center gap-3 text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg> Orders</button></li>
                    <li><button id="nav-products" onclick="window.app.switchTab('products', 'Store', 'Products')" class="nav-btn w-full flex items-center gap-3 text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg> Products</button></li>
                    <li><button id="nav-categories" onclick="window.app.switchTab('categories', 'Store', 'Categories')" class="nav-btn w-full flex items-center gap-3 text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg> Categories</button></li>
                    <li><button id="nav-customers" onclick="window.app.switchTab('customers', 'CRM', 'Customers')" class="nav-btn w-full flex items-center gap-3 text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> Customers</button></li>
                    <li><button id="nav-upcoming-projects" onclick="window.app.switchTab('upcoming-projects', 'Operations', 'Upcoming Projects')" class="nav-btn w-full flex items-center gap-3 text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Upcoming Projects</button></li>
                    
                    <li class="pt-2">
                        <button onclick="window.app.toggleAccordion('enquiries-accordion', 'enquiries-chevron')" class="nav-btn w-full flex items-center justify-between text-left py-2.5 px-3 transition-all duration-300 ease-out hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm focus-visible:outline-none">
                            <div class="flex items-center gap-3"><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg> Enquiries</div>
                            <svg id="enquiries-chevron" class="w-4 h-4 transform rotate-180 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div id="enquiries-accordion" class="grid grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out">
                            <div class="overflow-hidden">
                                <ul class="mt-1 ml-4 pl-2 space-y-1">
                                    <li><button id="nav-technical" onclick="window.app.switchTab('technical', 'Enquiries', 'Technical Support')" class="nav-sub-btn w-full text-left py-2 px-3 text-[#d4af37] bg-[#d4af37]/5 rounded-sm text-sm transition-colors">Technical Support</button></li>
                                    <li><button id="nav-quotations" onclick="window.app.switchTab('quotations', 'Enquiries', 'Quotations')" class="nav-sub-btn w-full text-left py-2 px-3 text-[#1f271b]/70 hover:text-[#d4af37] hover:bg-[#d4af37]/5 rounded-sm text-sm transition-colors">Quotations</button></li>
                                </ul>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Area Wrapper -->
        <main class="flex-1 min-w-0 flex flex-col h-full bg-white relative overflow-hidden">
            <!-- Global Top App Bar -->
            <header class="h-[72px] shrink-0 bg-white border-b border-[#12170f]/10 px-8 flex items-center justify-between z-30">
                <div class="flex items-center text-sm font-semibold text-[#1f271b]/60 w-1/3">
                    <span id="breadcrumb-parent">Store</span>
                    <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span id="breadcrumb-current" class="text-[#d4af37]">Products</span>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center justify-end gap-5 w-1/3">
                    <!-- Profile Dropdown -->
                    <div class="relative" id="profile-menu-container">
                        <button aria-label="Account menu" aria-expanded="false" aria-controls="profile-dropdown" onclick="window.app.toggleProfileMenu(event)" class="flex items-center gap-2 focus-visible:outline-none group">
                            <div class="w-9 h-9 rounded-full bg-[#f1f5f9] text-[#1f271b] flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <svg class="w-4 h-4 text-[#1f271b]/60 group-hover:text-[#12170f]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div id="profile-dropdown" inert class="absolute right-0 top-full mt-3 w-48 bg-white border border-[#12170f]/10 rounded-sm shadow-xl opacity-0 scale-95 pointer-events-none transition-all duration-200 z-50 origin-top-right flex flex-col">
                            <div class="px-4 py-3 border-b border-[#12170f]/10 bg-[#f8fafc]">
                                <p class="text-[10px] font-bold text-[#1f271b]/40 uppercase tracking-wider">Signed in as</p>
                                <!-- Filled by admin-auth-module.js from GET /api/admin/session.
                                     It used to read a hardcoded "ADMINISTRATOR", which was all
                                     it could say when the only credential was a shared password. -->
                                <p id="admin-identity" class="text-sm font-bold text-[#12170f] mt-0.5 break-words">Administrator</p>
                            </div>
                            <button onclick="window.app.handleLogout()" class="w-full text-left px-4 py-3 text-sm font-bold text-[#1f271b]/70 border-t border-[#12170f]/10 hover:bg-red-50 hover:text-red-600 transition-colors focus-visible:outline-none flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                Terminate Session
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div id="dynamic-view" class="flex-1 flex w-full h-[calc(100vh-72px)] overflow-hidden bg-[#f8fafc]">
                <section id="main-content" class="flex-1 overflow-y-auto p-8 md:p-10 lg:p-12 no-scrollbar relative"></section>
                <aside id="details-drawer" class="w-[480px] hidden shrink-0 bg-white border-l border-[#12170f]/10 flex flex-col h-full overflow-hidden shadow-[-4px_0_15px_-5px_rgba(0,0,0,0.05)] z-20"></aside>
            </div>
        </main>
    </div>



    <!-- Templates keep dependencies visible to verify-links without requesting
         them before sign-in. Classic scripts retain their window.* interface.
         ORDER: scroll lock before navigation; shared helpers before tabs. -->
    <template id="admin-shell-assets">
        <link rel="stylesheet" href="/assets/vendor/tailwind.build.css">
        <link rel="stylesheet" href="/assets/vendor/fonts/fonts.css">
        <script src="/js/platform/disable-input-suggestions-module.js"></script>
        <script src="/js/platform/scroll-lock-module.js"></script>
        <script src="/js/platform/responsive-navigation-module.js"></script>
        <script src="/js/shared/price-format-module.js"></script>
        <script src="/js/platform/custom-select-module.js"></script>
        <script src="/js/modules/admin/shell/admin-shell.js"></script>
    </template>
    <template id="admin-tab-assets">
        <script data-tab="dashboard" src="/js/modules/admin/shell/dashboard.js"></script>
        <!-- dashboard.js also owns the shared adminDashboardUI helpers. -->
        <script data-tab="customers" data-depends-on="dashboard" src="/js/modules/admin/tabs/customers.js"></script>
        <script data-tab="technical" data-depends-on="dashboard" src="/js/modules/admin/tabs/enquiries.js"></script>
        <script data-tab="quotations" data-depends-on="dashboard" src="/js/modules/admin/tabs/quotations.js"></script>
        <script data-tab="orders" data-depends-on="dashboard" src="/js/modules/admin/tabs/orders.js"></script>
        <script data-tab="categories" data-depends-on="dashboard" src="/js/modules/admin/tabs/categories.js"></script>
        <script data-tab="products" data-depends-on="categories" src="/js/modules/admin/tabs/products.js"></script>
        <script data-tab="upcoming-projects" data-depends-on="dashboard" src="/js/modules/admin/tabs/upcoming-projects.js"></script>
    </template>
</body>
</html>
